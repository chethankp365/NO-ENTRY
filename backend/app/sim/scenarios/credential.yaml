id: credential
name: Credential attack
technique_id: T1110
description: spray, detect, auto-ban
steps:
  - stage: Port probe
    delay: 1.0
    event:
      technique_id: T1595
      technique_name: Active Scanning
      event: "hydra -l admin ssh://10.0.1.10 initialized"
      source_ip: 185.220.101.4
      target_host: web01
      state: DETECTED
      severity: LOW
      module: Red
      breach: false
  - stage: Password spraying
    delay: 2.0
    event:
      technique_id: T1110
      technique_name: Brute Force
      event: "source.ip: 185.220.101.4 trying 14,000 passwords (hits: 214 in last 10 min)"
      source_ip: 185.220.101.4
      target_host: web01
      state: ALERT
      severity: HIGH
      module: Watch
      breach: false
  - stage: Threshold triggered
    delay: 2.5
    event:
      technique_id: T1110
      technique_name: Brute Force
      event: T1110 brute force from 185.220.101.4 rule 100231 fired in 3.2s
      source_ip: 185.220.101.4
      target_host: web01
      state: ALERT
      severity: HIGH
      module: Watch
      breach: false
  - stage: Automated firewall ban
    delay: 2.0
    event:
      technique_id: T1110
      technique_name: Brute Force
      event: T1110 brute force 185.220.101.4 BLOCKED at firewall
      source_ip: 185.220.101.4
      target_host: pfsense
      state: BLOCKED
      severity: MEDIUM
      module: Reflex
      breach: false
