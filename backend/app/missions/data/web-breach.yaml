fix:
  prompt: "VoltGear's search handler builds SQL using string concatenation. Choose the durable remediation OR edit the code snippet to use parameterized placeholders and strict upload allowlisting."
  language: "python"
  vulnerable_code: |
    def search_products(cursor, q: str):
        # VULNERABLE: direct string interpolation into SQL statement
        sql = f"SELECT id, name, price FROM products WHERE name LIKE '%{q}%'"
        cursor.execute(sql)
        return cursor.fetchall()
  options:
    - id: "opt-client-only"
      label: "Strip single quotes only in browser JavaScript before fetch()"
      code_snippet: "q = input.value.replace(\"'\", \"\");"
      is_correct: false
      explanation: "Attackers bypass browser JavaScript completely using curl or sqlmap; validation in JS never protects the backend SQL parser."
    - id: "opt-blacklist"
      label: "Remove uppercase 'SELECT' keyword with str.replace()"
      code_snippet: "q = q.replace('SELECT', ''); cursor.execute(f\"... '%{q}%'\")"
      is_correct: false
      explanation: "Case-sensitive blacklists are trivially defeated with lowercase `union select` or nested tokens like `SELSELECTECT`."
    - id: "opt-parameterized"
      label: "Use parameterized prepared SQL placeholders + .php/.phtml upload denial"
      code_snippet: "cursor.execute('SELECT id, name, price FROM products WHERE name LIKE %s', (f'%{q}%',))"
      is_correct: true
      explanation: "Parameterized queries separate SQL syntax from user data at the driver level, neutralizing all SQL injection payloads."
  accepted_patch_patterns:
    - "cursor\\.execute\\([^)]*(%s|\\?|:\\w+)[^)]*,"
  patch_explanation: "Parameterized placeholder syntax cleanly binds `q` as data rather than executable SQL syntax."

verify:
  attack_command: "sqlmap -u \"http://10.0.1.10/api/v1/search?q=' UNION SELECT 1,username,password_hash--\" --batch && curl -F file=@c99.php http://10.0.1.10/admin/upload"
  blocked_output:
    - "[*] Re-running SQLi + web shell vector against hardened web01 (10.0.1.10)..."
    - "[403 FORBIDDEN] ModSecurity Rule 949110 matched Inbound Anomaly Score Exceeded (SQLi payload blocked)."
    - "[BACKEND QUERY] Prepared statement bound input strictly as literal string '%'' UNION SELECT...'; 0 unauthorized rows returned."
    - "[UPLOAD FILTER] Blocked extension .php -> File upload policy allows [.png, .jpg, .webp] only."
  blocked_log_line: "185.220.101.4 - - [11/Nov/2026:22:04:10 +0000] \"GET /api/v1/search?q=' UNION SELECT...\" 403 0 [BLOCKED ModSecurity 949110 + Prepared Statement]"
  waf_control: "ModSecurity CRS Rule 949110 + SQL Parameterized Prepared Statements + Strict Upload Allowlist"
  explanation: "With parameterized SQL statements in the application layer and ModSecurity blocking anomalous payloads at the reverse proxy, both the search SQLi and PHP shell upload fail immediately."

debrief:
  why_it_worked: "VoltGear concatenated the HTTP query parameter `q` and login field straight into raw SQL strings while leaving `/admin/upload` open to arbitrary `.php` scripts executable by Nginx/PHP-FPM."
  how_it_was_stopped: "You correlated the Apache/ModSecurity HTTP logs with MITRE T1190, deployed a zero-false-positive Sigma detection rule, refactored the database layer to parameterized queries, and proved ModSecurity + upload extension allowlisting block replay attacks."
  mitre_summary: "T1595 (Active Scanning) -> T1190 (Exploit Public-Facing Application) -> T1505 (Web Shell Component)."
  key_takeaways:
    - "Never format untrusted input into SQL queries; always use parameterized prepared statements."
    - "Treat client-side sanitization and naive keyword blacklists as non-security controls."
    - "Defense in depth: store uploads outside the webroot and disallow script execution in upload paths."

quiz:
  - id: "q1"
    question: "Why did VoltGear's search endpoint fall victim to UNION SELECT extraction?"
    options:
      - "Nginx was serving static files over HTTP port 80"
      - "User input `q` was interpolated directly into the SQL query string without parameterization"
      - "The database password used bcrypt hashing"
      - "The browser did not send a CSRF header"
    correct_index: 1
    explanation: "Concatenating `q` directly into SQL lets the database parser interpret SQL quotes and UNION keywords as instructions instead of data."
  - id: "q2"
    question: "Which MITRE ATT&CK technique corresponds to exploiting an internet-facing web SQLi vulnerability?"
    options:
      - "T1486 - Data Encrypted for Impact"
      - "T1190 - Exploit Public-Facing Application"
      - "T1003 - OS Credential Dumping"
      - "T1071 - Application Layer Protocol"
    correct_index: 1
    explanation: "T1190 captures exploitation of software flaws in public-facing web applications and APIs."
  - id: "q3"
    question: "Why is blocking only `'SELECT'` via string replacement an inadequate SQLi fix?"
    options:
      - "It slows down CSS rendering"
      - "Attackers easily bypass naive blacklists via lowercase keywords, URL encoding, or nested tokens"
      - "SQL does not use the SELECT keyword"
      - "Prepared statements require blacklists to function"
    correct_index: 1
    explanation: "Adversaries bypass case-sensitive or single-pass string stripping cleanly; parameterized queries fix the root parsing boundary."
  - id: "q4"
    question: "When writing a Sigma rule for `/api/v1/search`, why did we check benign requests like `?q=mechanical+keyboard`?"
    options:
      - "To increase total alert volume"
      - "To verify zero false positives so normal customer browsing does not flood SOC analysts or trigger bad auto-bans"
      - "Because ModSecurity ignores POST traffic"
      - "To allow php uploads on staging servers"
    correct_index: 1
    explanation: "Testing against normal baseline traffic ensures high-signal detections without disrupting legitimate users."
  - id: "q5"
    question: "What secondary hardening control prevents an uploaded `c99.php` from running even if an attacker reaches the upload folder?"
    options:
      - "Allowing all extensions in `/var/www/uploads`"
      - "Renaming the admin URL only"
      - "Allowlisting safe image MIME/extensions and disabling script execution in upload directories"
      - "Turning off Apache access logging"
    correct_index: 2
    explanation: "Strict allowlists combined with non-executable storage permissions prevent web shell code execution."

