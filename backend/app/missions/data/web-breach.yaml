rule_challenge:
  prompt: "Select the primary MITRE ATT&CK technique and complete the Sigma rule below to match SQLi probes and web shell requests with ZERO false positives on normal VoltGear customer traffic."
  expected_mitre_id: "T1190"
  mitre_choices:
    - id: "T1190"
      label: "T1190 - Exploit Public-Facing Application"
    - id: "T1110"
      label: "T1110 - Brute Force"
    - id: "T1486"
      label: "T1486 - Data Encrypted for Impact"
    - id: "T1048"
      label: "T1048 - Exfiltration Over Alternative Protocol"
  required_min_hits: 2
  max_false_positives: 0
  template_yaml: |
    title: VoltGear SQLi and Webshell Detection
    id: rule-mission-web-breach
    level: high
    logsource:
      category: webserver
      service: apache
    detection:
      selection:
        uri|contains:
          - "REPLACE_WITH_SQLI_SUBSTRING"
          - "REPLACE_WITH_SHELL_FILENAME"
      condition: selection
  reference_solution_yaml: |
    title: VoltGear SQLi and Webshell Detection
    id: rule-mission-web-breach
    level: high
    logsource:
      category: webserver
      service: apache
    detection:
      selection:
        uri|contains:
          - "union select"
          - "' or '1'='1"
          - "c99.php"
      condition: selection
  benign_baseline_logs:
    - source: "apache"
      event_type: "normal"
      technique_id: "NONE"
      source_ip: "10.0.2.20"
      target_host: "web01"
      raw_line: "10.0.2.20 - - [11/Nov/2026:22:00:44 +0000] \"GET /index.html HTTP/1.1\" 200 4120 \"-\" \"Mozilla/5.0\""
      benign: true
      is_true_positive: false
      structured:
        uri: "/index.html"
        method: "GET"
        status_code: 200
        source_ip: "10.0.2.20"
        benign: true
    - source: "apache"
      event_type: "normal"
      technique_id: "NONE"
      source_ip: "10.0.2.21"
      target_host: "web01"
      raw_line: "10.0.2.21 - - [11/Nov/2026:22:01:02 +0000] \"GET /api/v1/search?q=mechanical+keyboard HTTP/1.1\" 200 940 \"-\" \"Mozilla/5.0\""
      benign: true
