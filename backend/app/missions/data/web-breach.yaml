story: "VoltGear, a small online electronics shop hosted on DMZ node web01 (10.0.1.10), was compromised overnight. Customer order history vanished and a strange PHP file appeared in /var/www/uploads/. Reproduce the intrusion in our isolated lab, inspect the Apache & ModSecurity logs your attack leaves behind, write the Sigma rule to catch it, parameterize the vulnerable query, and prove the patch blocks re-exploitation."
scope: "10.0.0.0/16 Virtual Corporate Range (Isolated). Only attack VoltGear on 10.0.1.10 (web01). Lab is isolated. Attacks stay inside the range."
briefing_lines:
  - "INCIDENT TICKET #VG-2026-01 // TARGET: VoltGear Storefront (10.0.1.10 // web01)"
  - "A small online shop was just hacked. Find out how, recover the leaked flag, then switch sides to detect and patch the flaw."
  - "REMINDER: Lab is isolated. Attacks stay inside the range."
