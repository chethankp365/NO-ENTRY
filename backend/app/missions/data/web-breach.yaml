id: web-breach
order: 2
title: "The Hacked Shop"
subtitle: "sqli to web shell to pivot"
description: "Exploit VoltGear's unparameterized e-commerce search, capture the admin flag, then author a zero-false-positive detection rule, patch the SQL query, and verify it is blocked."
